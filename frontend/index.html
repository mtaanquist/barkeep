<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Essential favicons for high DPI support -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Barkeep</title>
    <script>
      // Settles light or dark before anything is drawn, so the page never
      // flashes the wrong one on the way in. Small and inline for that
      // reason. Either what was picked here before, or what the phone says.
      (function () {
        try {
          var saved = localStorage.getItem("homeBarSystem_theme");
          var picked = saved ? JSON.parse(saved) : "system";
          var dark =
            picked === "dark" ||
            (picked !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
          root.dataset.colorMode = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
